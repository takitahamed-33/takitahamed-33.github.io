<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual APC/C–CDC20 research visual</title>
  <desc id="desc">A stylized molecular complex connected to docking, ADMET, developability and experimental testing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#f7f2e8"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#1b6b52"/>
      <stop offset="1" stop-color="#123c30"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="44" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#1b6b52" stroke-width="2" fill="none">
    <path d="M80 120 C260 30 380 210 540 120 S830 40 1110 160"/>
    <path d="M70 650 C250 540 360 700 520 600 S830 500 1130 620"/>
  </g>
  <g transform="translate(390 375)" filter="url(#shadow)">
    <ellipse rx="250" ry="168" fill="#fff" opacity="0.76"/>
    <path d="M-198 -35 C-160 -155 -50 -180 25 -120 C95 -63 183 -98 210 -6 C236 86 154 149 62 128 C-31 106 -74 178 -157 102 C-222 42 -230 8 -198 -35Z" fill="url(#core)"/>
    <g fill="#b9d7c9" opacity="0.95">
      <circle cx="-130" cy="-55" r="18"/><circle cx="-69" cy="-101" r="23"/><circle cx="5" cy="-89" r="16"/>
      <circle cx="75" cy="-44" r="25"/><circle cx="125" cy="14" r="19"/><circle cx="82" cy="71" r="22"/>
      <circle cx="12" cy="87" r="17"/><circle cx="-58" cy="71" r="25"/><circle cx="-127" cy="30" r="19"/>
    </g>
    <circle cx="78" cy="-104" r="54" fill="#d7974f"/>
    <text x="78" y="-99" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#fff">CDC20</text>
    <text x="0" y="12" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#fff">APC/C</text>
    <text x="0" y="41" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#d7ebe2">cell-cycle regulation</text>
  </g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(790 145)">
      <rect width="320" height="102" rx="24" fill="#fff" stroke="#d6e2dc"/>
      <circle cx="49" cy="51" r="24" fill="#e9f3ee"/>
      <path d="M39 56 L47 64 L61 41" fill="none" stroke="#1b6b52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="45" font-size="18" font-weight="700" fill="#16382e">Docking evidence</text>
      <text x="88" y="69" font-size="14" fill="#64736d">site-specific structural prioritization</text>
    </g>
    <g transform="translate(820 285)">
      <rect width="290" height="102" rx="24" fill="#fff" stroke="#d6e2dc"/>
      <circle cx="49" cy="51" r="24" fill="#f8ede0"/>
      <path d="M38 39 h22 v24 h-22z M43 34 h12" fill="none" stroke="#b56d2d" stroke-width="4" stroke-linecap="round"/>
      <text x="88" y="45" font-size="18" font-weight="700" fill="#16382e">ADMET &amp; safety</text>
      <text x="88" y="69" font-size="14" fill="#64736d">predicted pharmacology and liabilities</text>
    </g>
    <g transform="translate(790 425)">
      <rect width="320" height="102" rx="24" fill="#fff" stroke="#d6e2dc"/>
      <circle cx="49" cy="51" r="24" fill="#e9f3ee"/>
      <path d="M34 58 C43 44 53 44 64 58" fill="none" stroke="#1b6b52" stroke-width="4"/>
      <circle cx="40" cy="44" r="5" fill="#1b6b52"/><circle cx="58" cy="44" r="5" fill="#1b6b52"/>
      <text x="88" y="45" font-size="18" font-weight="700" fill="#16382e">Developability</text>
      <text x="88" y="69" font-size="14" fill="#64736d">assay exposure, chemistry, evidence confidence</text>
    </g>
    <g transform="translate(745 565)">
      <rect width="365" height="102" rx="24" fill="#16382e"/>
      <circle cx="49" cy="51" r="24" fill="#2d6e5a"/>
      <path d="M40 38 v20 c0 12 18 12 18 0 v-20 M37 37 h24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="88" y="45" font-size="18" font-weight="700" fill="#fff">Experimental follow-up</text>
      <text x="88" y="69" font-size="14" fill="#cce0d8">shortlists for RPE-1 and MDA-MB-231 testing</text>
    </g>
  </g>
  <g stroke="#1b6b52" stroke-width="3" fill="none" opacity="0.55">
    <path d="M600 285 C700 220 735 205 790 196"/>
    <path d="M625 346 C720 340 760 337 820 336"/>
    <path d="M625 410 C720 430 746 458 790 476"/>
    <path d="M580 495 C680 570 700 590 745 610"/>
  </g>
</svg>
